name: Bug report
description: 报告软件缺陷
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要公开 API Key、密码或个人隐私数据。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 应用版本、commit hash 或 tag
      placeholder: v0.1.0 / commit abc1234
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Web
        - Electron Windows
        - Electron macOS
        - Electron Linux
        - Android
        - iOS
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台或日志
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 附加信息
