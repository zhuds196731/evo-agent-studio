name: Feature request
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      validations:
        required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      validations:
        required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案

  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: 会话与智能体
        - label: 岗位中心
        - label: 先哲堂
        - label: 知识库或三维图谱
        - label: 记事本
        - label: 投资分析
        - label: 插件或自进化
        - label: 打包与发布
        - label: 主题或视觉
        - label: 安全与隐私

  - type: textarea
    id: context
    attributes:
      label: 附加信息
